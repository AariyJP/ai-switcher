name: Create Release Commit

on:
  workflow_dispatch:
    inputs:
      source_branch:
        required: true
        default: develop
        type: choice
        options:
          - develop
      version:
        required: true

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-slim
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 3566973
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          git config user.name 'aariyjp[bot]'
          git config user.email '280956696+aariyjp[bot]@users.noreply.github.com'
          git merge --no-ff "origin/${SOURCE_BRANCH}" -m "$VERSION"
          git push origin HEAD:main
