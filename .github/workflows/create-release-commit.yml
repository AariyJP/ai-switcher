name: Create Release Commit

on:
  workflow_dispatch:
    inputs:
      source_branch:
        required: true
        default: develop
      version:
        required: true

concurrency:
  group: create-release-commit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-slim
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23ctmE0LHCwq58gBqC
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/merges" \
            -f base=main \
            -f head="${SOURCE_BRANCH}" \
            -f commit_message="$VERSION"
