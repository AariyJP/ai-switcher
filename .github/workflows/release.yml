on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  set_version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: set_version
        run: |
          VERSION="$(git log -1 --format=%s | tr -d '[:space:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: [set_version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundle_dir: dmg
            pattern: "*.dmg"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_dir: nsis
            pattern: "*-setup.exe"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.target }}
      - run: pnpm i --frozen-lockfile --prefer-offline
      - run: pnpm version:bump "${{ needs.set_version.outputs.version }}"
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
      - uses: microsoft/setup-WinAppCli@v0.1
        if: runner.os == 'Windows'
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          stage="$RUNNER_TEMP/msix"
          mkdir -p "$stage"
          cp scripts/msix/* "src-tauri/target/${{ matrix.target }}/release/ai-switcher.exe" "$stage/"
          sed -i 's/Version="0.0.0.0"/Version="${{ needs.set_version.outputs.version }}.0"/' "$stage/AppxManifest.xml"
          winapp pack "$stage" --quiet

      - id: installer
        shell: bash
        run: |
          src="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle_dir }}" -maxdepth 1 -name '${{ matrix.pattern }}')"
          file="${src/_${{ needs.set_version.outputs.version }}/}"
          mv "$src" "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AI Switcher ${{ needs.set_version.outputs.version }}
          body: |
            AI Switcher ${{ needs.set_version.outputs.version }} ${{ github.sha }}
          draft: true
          files: |
            ${{ steps.installer.outputs.file }}
            *.msix

  release:
    needs: [set_version, build]
    runs-on: ubuntu-slim
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          draft: false
